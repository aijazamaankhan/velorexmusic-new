<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Google Analytics 4 (G-N6H3GG17TM).
       Placed after the CSP meta on purpose: a meta-delivered CSP only governs
       content that follows it. default-src allows https:, so no policy change
       was needed for googletagmanager.com.
       Loaded async, so it never blocks rendering or Core Web Vitals. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N6H3GG17TM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-N6H3GG17TM");
  </script>

  <title>Track Your Order | Velorex Music</title>
  <meta name="description" content="Track your Velorex Music order using your order ID and email address.">
  <!-- noindex: this page renders per-customer order state. It has no ranking
       value, and an order-tracking URL surfacing in search results would be a
       privacy problem, not a traffic win. Still "follow" so link equity keeps
       flowing through to the pages that do matter. -->
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://velorexmusic.com/track-order.html">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Velorex Music">
  <meta property="og:title" content="Track Your Order | Velorex Music">
  <meta property="og:url" content="https://velorexmusic.com/track-order.html">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles/tokens.css?v=a893990f">
  <link rel="stylesheet" href="src/styles/base.css?v=45f8212c">
  <style>
    .container { max-width: 900px; margin: 0 auto; padding: 3rem 1.5rem; }
    .glass-card { background: rgba(26, 26, 46, 0.6); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    [data-theme="light"] .glass-card { background: rgba(255, 255, 255, 0.85); }
    h1 { font-family: var(--font-display); font-size: 2.4rem; margin: 0 0 1.5rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; margin-bottom: 0.4rem; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .form-control { width: 100%; padding: 0.7rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; font-family: inherit; transition: 0.2s; box-sizing: border-box; }
    [data-theme="light"] .form-control { background: #f1f3f5; }
    .form-control:focus { outline: none; border-color: var(--secondary); background: rgba(255,255,255,0.08); }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(13, 13, 13, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    body { padding-top: 80px; }
    [data-theme="light"] .navbar { background: rgba(255, 255, 255, 0.95); }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    /* Brand lockup (mark + wordmark), one file per theme. This page has its own
       stylesheet rather than static-pages.css, so the rules are duplicated here. */
    .brand-lockup { height: 42px; width: auto; flex-shrink: 0; }
    .brand-lockup-dark { display: block; }
    .brand-lockup-light { display: none; }
    [data-theme="light"] .brand-lockup-dark { display: none; }
    [data-theme="light"] .brand-lockup-light { display: block; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.75rem 1.5rem; background: var(--secondary); color: white; border-radius: 8px; text-decoration: none; transition: 0.2s; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(255,107,53,0.35); }
    .btn-block { width: 100%; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.02em; }
    .error-banner { margin-top: 1rem; padding: 0.85rem 1rem; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: var(--danger); font-size: 0.9rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1.5rem; }
    @media (max-width: 600px) { .info-grid { grid-template-columns: 1fr; } }
    .info-card { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; }
    [data-theme="light"] .info-card { background: rgba(0,0,0,0.02); }
    .info-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; margin-bottom: 0.35rem; }
    .info-card .val { font-weight: 600; }
    .info-card .carrier-cell { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
    .carrier-cell-label { font-weight: 600; }

    /* Carrier badge — small white pill with the Clearbit logo inside.
       Hover on desktop OR focus (via tap on mobile, since tabindex=0) shows the
       tooltip. The badge isn't a link, so tapping doesn't navigate — it only
       reveals the carrier name. The actual tracking link is the separate button
       in #result-tracking-cta. */
    .carrier-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      min-width: 36px;
      padding: 3px 6px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
      cursor: help;
      position: relative;
      outline: none;
      vertical-align: middle;
    }
    .carrier-badge:focus { box-shadow: 0 0 0 2px var(--secondary, #ff6b35); }
    .carrier-badge svg { height: 22px; width: auto; max-width: 96px; display: block; }
    /* Retained for legacy data referencing a carrier id without a logo SVG. */
    .carrier-fallback { font-size: 0.72rem; font-weight: 700; color: #333; letter-spacing: 0.02em; padding: 0 2px; }
    .carrier-badge::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: #fff;
      padding: 0.3rem 0.55rem;
      border-radius: 5px;
      font-size: 0.72rem;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 10;
    }
    .carrier-badge:hover::after,
    .carrier-badge:focus::after { opacity: 1; }
    @media (max-width: 600px) {
      .carrier-badge { height: 32px; min-width: 42px; }
      .carrier-badge svg { height: 26px; max-width: 110px; }
    }
    .timeline { margin-top: 2rem; }
    .timeline-row { position: relative; padding: 0.5rem 0 0.5rem 2.25rem; }
    .timeline-row::before { content: ''; position: absolute; left: 0.65rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
    .timeline-row:first-child::before { top: 0.85rem; }
    .timeline-row:last-child::before { bottom: calc(100% - 0.85rem); }
    .timeline-dot { position: absolute; left: 0; top: 0.55rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: var(--text-muted); }
    .timeline-row.is-current .timeline-dot { background: var(--secondary); border-color: var(--secondary); color: white; box-shadow: 0 0 0 4px rgba(255,107,53,0.25); }
    .timeline-row.is-done .timeline-dot { background: var(--success); border-color: var(--success); color: white; }
    .timeline-title { font-weight: 700; font-size: 0.95rem; }
    .timeline-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.15rem; }
    .timeline-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem; font-style: italic; }
    .tracking-cta { margin-top: 1.5rem; padding: 1rem; background: rgba(255,107,53,0.08); border: 1px solid rgba(255,107,53,0.25); border-radius: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem; }
    .skeleton { color: var(--text-muted); padding: 1rem; text-align: center; }
    .hidden { display: none !important; }
    @media (max-width: 768px) {
      .container { padding: 2rem 1rem; }
      .glass-card { padding: 1.5rem; }
      h1 { font-size: 1.75rem; }
      .navbar { padding: 0.75rem 1rem; }
      .brand-name { font-size: 1.1rem; }
      .btn { padding: 0.65rem 1.1rem; font-size: 0.9rem; }
      .tracking-cta { flex-direction: column; align-items: stretch; text-align: center; }
      /* Prevent iOS auto-zoom on focus */
      .form-control { font-size: 16px; }
    }
  </style>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="/src/img/logo-lockup-dark.png" class="brand-lockup brand-lockup-dark" alt="Velorex Music" width="760" height="216">
      <img src="/src/img/logo-lockup-light.png" class="brand-lockup brand-lockup-light" alt="Velorex Music" width="760" height="215">
    </a>
    <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:0.9rem;">Back to Shop</a>
  </nav>

  <div class="container">
    <div class="glass-card" id="lookup-card">
      <h1>Track Your Order</h1>
      <p style="color:var(--text-muted);margin-top:-0.5rem;">Enter the order number and the email used at checkout.</p>

      <form onsubmit="trackOrder(event)" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="order-id">Order Number</label>
          <input type="text" id="order-id" class="form-control" placeholder="e.g. VD-A1B2C3" required autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="order-email">Email Address</label>
          <input type="email" id="order-email" class="form-control" placeholder="The email used during purchase" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-block" id="lookup-btn"><i class="fas fa-location-dot"></i> Find My Shipment</button>
        <div id="lookup-error" class="error-banner hidden"></div>
      </form>
    </div>

    <div class="glass-card hidden" id="result-card" style="margin-top:1.5rem;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:0.75rem;">
        <div>
          <h1 style="font-size:1.75rem;margin:0;">Order <span id="result-id"></span></h1>
          <div id="result-status-line" style="margin-top:0.4rem;"></div>
        </div>
        <button type="button" class="btn btn-secondary" onclick="resetTracker()"><i class="fas fa-arrow-left"></i> Track another</button>
      </div>

      <div class="info-grid">
        <div class="info-card"><div class="lbl">Order Date</div><div class="val" id="result-date">—</div></div>
        <div class="info-card"><div class="lbl">Order Total</div><div class="val" id="result-total">—</div></div>
        <div class="info-card">
          <div class="lbl">Carrier</div>
          <div class="val carrier-cell" id="result-carrier">—</div>
        </div>
        <div class="info-card"><div class="lbl">Tracking Number</div><div class="val" id="result-awb">—</div></div>
      </div>

      <div class="tracking-cta hidden" id="result-tracking-cta">
        <div>
          <div style="font-weight:700;">Track in real-time</div>
          <div style="font-size:0.85rem;color:var(--text-muted);">Opens the carrier's live tracking page.</div>
        </div>
        <a id="result-carrier-link" class="btn" href="#" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> Track on <span id="result-carrier-label">carrier</span></a>
      </div>

      <h3 style="margin-top:2rem;font-family:var(--font-display);">Status Timeline</h3>
      <div id="result-timeline" class="timeline"></div>

      <div id="result-shipto" style="margin-top:2rem;"></div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    const ORDER_STATUSES = ['pending', 'confirmed', 'packed', 'shipped', 'out_for_delivery', 'delivered'];
    const STATUS_LABEL = {
      pending: 'Order Placed', confirmed: 'Confirmed', packed: 'Packed',
      shipped: 'Shipped', out_for_delivery: 'Out for Delivery', delivered: 'Delivered',
      cancelled: 'Cancelled', returned: 'Returned', refunded: 'Refunded'
    };
    const STATUS_ICON = {
      pending: '📝', confirmed: '✅', packed: '📦', shipped: '🚚',
      out_for_delivery: '🛵', delivered: '🏠',
      cancelled: '✖', returned: '↩', refunded: '💸'
    };

    // Carrier metadata. `logo` is an inline SVG wordmark — self-contained, no
    // network requests, always renders. `url` is the live-tracking page template
    // — {awb} gets the customer's tracking number. Mirrored from index.html;
    // keep both in sync when adding a carrier.
    const CARRIERS_META = {
      delhivery: {
        label: 'Delhivery',
        url: 'https://www.delhivery.com/track-v2/package/{awb}',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 24" aria-hidden="true"><rect width="80" height="24" fill="#fff" rx="3"/><text x="40" y="17" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="13" fill="#dd2c2c" letter-spacing="-0.5">delhivery</text></svg>'
      },
      bluedart: {
        label: 'Bluedart',
        url: 'https://www.bluedart.com/web/guest/trackdartresult?trackFor=0&trackNo={awb}',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 24" aria-hidden="true"><rect width="80" height="24" fill="#fff" rx="3"/><text x="40" y="17" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="12.5" letter-spacing="-0.3"><tspan fill="#00266b">Blue</tspan><tspan fill="#d50032">dart</tspan></text></svg>'
      },
      dtdc: {
        label: 'DTDC',
        url: 'https://www.dtdc.in/tracking/tracking_results.asp?strCnno={awb}&TrkType=cnno',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24" aria-hidden="true"><rect width="60" height="24" fill="#fff" rx="3"/><text x="30" y="18" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="15" fill="#f47521" letter-spacing="0.5">DTDC</text></svg>'
      },
      indiapost: {
        label: 'India Post',
        url: 'https://www.indiapost.gov.in/_layouts/15/dop.portal.tracking/trackconsignment.aspx',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 24" aria-hidden="true"><rect width="90" height="24" fill="#fff" rx="3"/><text x="45" y="16" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="11" fill="#003478" letter-spacing="0.3">INDIA POST</text></svg>'
      },
      fedex: {
        label: 'FedEx',
        url: 'https://www.fedex.com/fedextrack/?tracknumbers={awb}',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 24" aria-hidden="true"><rect width="60" height="24" fill="#fff" rx="3"/><text x="30" y="18" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="14.5" letter-spacing="-0.5"><tspan fill="#4d148c">Fed</tspan><tspan fill="#ff6600">Ex</tspan></text></svg>'
      },
      dhl: {
        label: 'DHL',
        url: 'https://www.dhl.com/in-en/home/tracking/tracking-express.html?tracking-id={awb}',
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 24" aria-hidden="true"><rect width="56" height="24" fill="#ffcc00" rx="3"/><text x="28" y="17" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="14" fill="#d40511" letter-spacing="-0.5">DHL</text><rect x="6" y="19" width="44" height="1.5" fill="#d40511"/></svg>'
      },
      other: {
        label: 'Carrier',
        url: null,
        logo: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 24" aria-hidden="true"><rect width="70" height="24" fill="#fff" rx="3"/><text x="35" y="17" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="11" fill="#333">Carrier</text></svg>'
      }
    };

    function carrierMeta(id) {
      return CARRIERS_META[String(id || '').toLowerCase()] || null;
    }

    // Inline-flex chip with the SVG wordmark, tooltip on hover (desktop) and
    // on focus (mobile tap, since tabindex=0). The pill isn't a link — that
    // keeps tap-to-identify separate from tap-to-track (the AWB number is the
    // link in the customer order card; this page has a separate "Track" button).
    function carrierBadgeHtml(id) {
      var m = carrierMeta(id);
      if (!m) return '';
      var label = escape(m.label);
      return '<span class="carrier-badge" tabindex="0" data-tooltip="' + label + '" aria-label="' + label + '">' +
        m.logo +
        '</span>';
    }

    function escape(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function fmtDateTime(s) {
      if (!s) return '';
      // PHP returns 'YYYY-MM-DD HH:MM:SS' (server time). Treat as UTC for portability.
      try { return new Date(s.replace(' ', 'T') + 'Z').toLocaleString(); } catch { return s; }
    }

    function fmtMoney(n) { return '₹' + Number(n || 0).toLocaleString(); }

    function carrierTrackingUrl(order) {
      if (order.trackingUrl) return order.trackingUrl;
      var m = carrierMeta(order.carrier);
      if (!m || !m.url || !order.trackingNumber) return null;
      return m.url.replace('{awb}', encodeURIComponent(order.trackingNumber));
    }

    function carrierLabel(order) {
      if (!order.carrier) return null;
      var m = carrierMeta(order.carrier);
      return m ? m.label : order.carrier;
    }

    async function trackOrder(ev) {
      ev.preventDefault();
      var id = document.getElementById('order-id').value.trim();
      var email = document.getElementById('order-email').value.trim();
      var errEl = document.getElementById('lookup-error');
      var btn = document.getElementById('lookup-btn');
      errEl.classList.add('hidden');
      if (!id || !email) return;
      btn.disabled = true;
      var orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching…';
      try {
        var res = await fetch(API_BASE + '/orders.php?id=' + encodeURIComponent(id) + '&email=' + encodeURIComponent(email), { cache: 'no-store' });
        var data = await res.json().catch(() => ({}));
        if (!res.ok) {
          var msg = data && data.error ? data.error : ('Lookup failed (HTTP ' + res.status + ')');
          if (res.status === 404) msg = 'No order found for that order number + email combination. Double-check both fields.';
          errEl.textContent = msg;
          errEl.classList.remove('hidden');
          return;
        }
        renderOrder(data);
      } catch (e) {
        errEl.textContent = 'Network error. Please try again.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.innerHTML = orig;
      }
    }

    function statusBadgeHtml(status) {
      var s = (status || 'pending').toLowerCase();
      var palette = {
        pending:          ['rgba(255,184,0,0.10)', '#ffb800'],
        confirmed:        ['rgba(255,184,0,0.10)', '#ffb800'],
        packed:           ['rgba(168,85,247,0.12)', '#c084fc'],
        shipped:          ['rgba(59,130,246,0.12)', '#3b82f6'],
        out_for_delivery: ['rgba(14,165,233,0.14)', '#38bdf8'],
        delivered:        ['rgba(0,212,170,0.10)',  '#00d4aa'],
        cancelled:        ['rgba(239,68,68,0.12)',  '#ef4444'],
        returned:         ['rgba(239,68,68,0.10)',  '#ef4444'],
        refunded:         ['rgba(148,163,184,0.18)', '#94a3b8']
      };
      var p = palette[s] || palette.pending;
      return '<span class="badge" style="background:' + p[0] + ';color:' + p[1] + ';">' + (STATUS_LABEL[s] || s) + '</span>';
    }

    // Build a "stepper" timeline: shows every step in ORDER_STATUSES, plus any
    // history entries off the happy path (cancelled / returned / refunded).
    function buildTimeline(order) {
      var current = (order.status || 'pending').toLowerCase();
      var history = Array.isArray(order.statusHistory) ? order.statusHistory : [];
      // First time each status was reached.
      var firstAt = {};
      var firstNote = {};
      history.forEach(function (h) {
        var s = (h.status || '').toLowerCase();
        if (!firstAt[s]) { firstAt[s] = h.at; firstNote[s] = h.note || ''; }
      });

      var offPath = ['cancelled', 'returned', 'refunded'].find(function (s) { return s === current; });
      var steps = offPath
        ? ['pending', current]            // collapsed flow if the order was terminated early
        : ORDER_STATUSES;

      var currentIdx = steps.indexOf(current);
      if (currentIdx === -1) currentIdx = 0;

      return steps.map(function (s, i) {
        var done = i < currentIdx;
        var isCurrent = i === currentIdx;
        var cls = done ? 'is-done' : (isCurrent ? 'is-current' : '');
        var when = firstAt[s] ? fmtDateTime(firstAt[s]) : (i <= currentIdx ? '' : 'Upcoming');
        var note = firstNote[s] ? '<div class="timeline-note">' + escape(firstNote[s]) + '</div>' : '';
        return '<div class="timeline-row ' + cls + '">' +
          '<div class="timeline-dot">' + (STATUS_ICON[s] || '•') + '</div>' +
          '<div class="timeline-title">' + escape(STATUS_LABEL[s] || s) + '</div>' +
          '<div class="timeline-meta">' + escape(when) + '</div>' +
          note +
          '</div>';
      }).join('');
    }

    function renderOrder(order) {
      document.getElementById('lookup-card').classList.add('hidden');
      document.getElementById('result-card').classList.remove('hidden');

      document.getElementById('result-id').textContent = '#' + (order.id || '');
      document.getElementById('result-status-line').innerHTML = statusBadgeHtml(order.status);
      document.getElementById('result-date').textContent = fmtDateTime(order.createdAt) || '—';
      document.getElementById('result-total').textContent = order.total != null ? fmtMoney(order.total) : '—';

      var carrier = carrierLabel(order);
      var carrierCell = document.getElementById('result-carrier');
      if (carrier) {
        // innerHTML rather than textContent — the badge contains the <img>+tooltip wrapper.
        // The badge values are escape()'d inside carrierBadgeHtml.
        carrierCell.innerHTML = carrierBadgeHtml(order.carrier) + '<span class="carrier-cell-label">' + escape(carrier) + '</span>';
      } else {
        carrierCell.textContent = '—';
      }
      document.getElementById('result-awb').textContent = order.trackingNumber || '—';

      var cta = document.getElementById('result-tracking-cta');
      var url = carrierTrackingUrl(order);
      if (url && carrier) {
        document.getElementById('result-carrier-link').href = url;
        document.getElementById('result-carrier-label').textContent = carrier;
        cta.classList.remove('hidden');
      } else {
        cta.classList.add('hidden');
      }

      document.getElementById('result-timeline').innerHTML = buildTimeline(order);

      var ship = order.shippingAddress;
      var shipToEl = document.getElementById('result-shipto');
      if (ship && typeof ship === 'object') {
        var parts = [ship.line1, ship.line2, ship.landmark, ship.city, ship.state, ship.postalCode, ship.country || ship.countryCode].filter(Boolean);
        shipToEl.innerHTML = '<div class="info-card"><div class="lbl">Shipping To</div>' +
          '<div class="val">' + escape(ship.fullName || '') + '</div>' +
          '<div style="font-size:0.85rem;color:var(--text-muted);margin-top:0.3rem;">' + escape(parts.join(', ')) + '</div>' +
          (ship.phone ? '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.25rem;">📞 ' + escape(ship.phone) + '</div>' : '') +
          '</div>';
      } else {
        shipToEl.innerHTML = '';
      }
    }

    function resetTracker() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('lookup-card').classList.remove('hidden');
      document.getElementById('order-id').value = '';
      document.getElementById('order-email').value = '';
      document.getElementById('lookup-error').classList.add('hidden');
    }

    // Auto-fill from query string. If both id + email are present, kick off the
    // lookup automatically — that's the flow when a customer clicks "Track Order"
    // from the profile page or from the receipt email link.
    //
    // Accept both ?id= and ?orderId= so older receipt emails (which used the
    // longer name before the param was standardized) continue to work.
    (function () {
      var p = new URLSearchParams(window.location.search);
      var id = p.get('id') || p.get('orderId');
      var email = p.get('email');
      if (id) document.getElementById('order-id').value = id;
      if (email) document.getElementById('order-email').value = email;
      if (id && email) {
        document.querySelector('form').dispatchEvent(new Event('submit', { cancelable: true }));
      }
    })();
  </script>
</body>
</html>
