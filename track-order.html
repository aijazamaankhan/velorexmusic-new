<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Track Order | Velorex Music</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a0a2e; --secondary: #ff6b35; --accent: #ffd700; --bg: #0d0d0d; --surface: #1a1a2e; --text: #f0eaf8; --text-muted: #9890b0; --border: #2e2e5e;
      --font-display: 'Playfair Display', serif; --font-body: 'DM Sans', sans-serif; --radius: 12px;
      --orange-gradient: linear-gradient(135deg, #ff6b35, #ff3a00); --gold-gradient: linear-gradient(135deg, #ffd700, #ff8c00);
    }
    :root[data-theme="light"] {
      --primary: #ffffff; --bg: #f8fafc; --surface: #ffffff; --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); line-height: 1.6; margin: 0; }
    .container { max-width: 900px; margin: 0 auto; padding: 4rem 2rem; }
    .glass-card { background: rgba(26, 26, 46, 0.6); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); padding: 3rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    [data-theme="light"] .glass-card { background: rgba(255, 255, 255, 0.8); }
    h1 { font-family: var(--font-display); font-size: 3rem; margin-bottom: 2rem; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; transition: 0.3s; }
    [data-theme="light"] .form-control { background: #f1f3f5; color: #1a0a2e; }
    .form-control:focus { outline: none; border-color: var(--secondary); background: rgba(255,255,255,0.1); }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(13, 13, 13, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    body { padding-top: 80px; }
    [data-theme="light"] .navbar { background: rgba(255, 255, 255, 0.95); }
    .brand { display: flex; align-items: center; gap: 1rem; text-decoration: none; }
    .logo-icon { width: 32px; height: 32px; background: var(--orange-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .brand-name { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; color: var(--text); }
    .btn { display: inline-block; width: 100%; padding: 0.75rem 1.5rem; background: var(--secondary); color: white; border-radius: 8px; text-decoration: none; transition: 0.3s; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,107,53,0.4); }
    #tracking-result { margin-top: 2rem; padding: 2rem; background: rgba(0,212,170,0.1); border: 1px solid var(--success); border-radius: 8px; display: none; }
  </style>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="logo-icon"><i class="fas fa-music"></i></div>
      <span class="brand-name">Velorex Music</span>
    </a>
    <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:0.9rem;">Back to Shop</a>
  </nav>

  <div class="container">
    <div class="glass-card">
      <h1>Track Your Order</h1>
      <p>Enter your order details below to see the current status of your shipment.</p>
      
      <form onsubmit="trackOrder(event)">
        <div class="form-group">
          <label class="form-label">Order Number</label>
          <input type="text" class="form-control" placeholder="E.g. VD-2024-001" required id="order-id">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="The email used during purchase" required>
        </div>
        <button type="submit" class="btn"><i class="fas fa-location-dot"></i> Find My Shipment</button>
      </form>

      <div id="tracking-result">
        <h3 style="color:var(--success); margin-bottom:0.5rem;">Shipment Found!</h3>
        <p style="color:var(--text); font-weight:600;" id="status-text"></p>
        <div style="font-size:0.8rem; color:var(--text-muted);" id="date-text"></div>
      </div>
    </div>
  </div>

  <script>
    function trackOrder(e) {
      e.preventDefault();
      const id = document.getElementById('order-id').value;
      const result = document.getElementById('tracking-result');
      const status = document.getElementById('status-text');
      const date = document.getElementById('date-text');
      
      // Dummy logic
      result.style.display = 'block';
      status.textContent = "Status: In Transit (On its way to you)";
      date.textContent = "Last Update: Out for delivery from nearest hub";
    }
  </script>
</body>
</html>
