<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Velorex Music">
  <!-- Vinyl record mark. Colours mirror the storefront tokens:
       --primary #0d0d0d (record body) and the gold/orange accent gradient. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="#0d0d0d"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.55"/>
  <circle cx="32" cy="32" r="18.5" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.75"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.9"/>
  <circle cx="32" cy="32" r="8" fill="url(#g)"/>
  <circle cx="32" cy="32" r="2.4" fill="#0d0d0d"/>
</svg>
