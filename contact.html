  <!-- LocalBusiness (Store) nodes for the two branches. This is what feeds
       "record store near me" / "vinyl store Gurugram" style queries and the
       Google Business knowledge panel. The address and phone MUST match the
       visible text in the page body and your Google Business Profile exactly
       — NAP (name/address/phone) consistency is the core local ranking
       signal, and a mismatch actively suppresses the listing. -->
  <script type="application/ld+json">

    "url": "https://velorexmusic.com/",
    "image": "https://velorexmusic.com/src/img/logo-1200.png",
    "telephone": "+91-79060-27807",
    "parentOrganization": { "@id": "https://velorexmusic.com/#organization" },
    "priceRange": "₹₹",
    "currenciesAccepted": "INR",
    "paymentAccepted": "UPI, Credit Card, Debit Card, Net Banking",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Sector 52",
      "addressLocality": "Gurugram",
      "addressRegion": "Haryana",
      "postalCode": "122003",
      "addressCountry": "IN"
    },
    "areaServed": { "@type": "Country", "name": "India" }
  }
  </script>

  <style>
    /* Page-specific: contact-grid layout + form controls + info rows.
       Shared navbar/brand/glass-card/h1/btn/responsive live in
       src/styles/pages/static-pages.css. */
    .container { max-width: 1000px; margin: 0 auto; padding: 4rem 2rem; }
    .contact-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 3rem; }
    .info-item { margin-bottom: 2rem; }
    .info-label { color: var(--secondary); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; }
    .info-value { font-size: 1.1rem; color: var(--text); }
    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
    .form-control { width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; transition: 0.3s; }
    [data-theme="light"] .form-control { background: #f1f3f5; color: #1a0a2e; }
    .form-control:focus { outline: none; border-color: var(--secondary); background: rgba(255,255,255,0.1); }
    /* The contact form submit is full-width; the shared .btn is inline-block by default. */
    form .btn { width: 100%; }
    @media (max-width: 768px) {
      .container { padding: 2rem 1rem; }
      .contact-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="brand">
      <img src="/src/img/logo-lockup-dark.png" class="brand-lockup brand-lockup-dark" alt="Velorex Music" width="760" height="216">
      <img src="/src/img/logo-lockup-light.png" class="brand-lockup brand-lockup-light" alt="Velorex Music" width="760" height="215">
    </a>
    <a href="index.html" style="color:var(--text-muted); text-decoration:none; font-size:0.9rem;">Back to Shop</a>
  </nav>

  <div class="container">
    <h1>Contact Us</h1>
    <div class="contact-grid">
      <div class="glass-card">
        <div class="info-item">
          <div class="info-label">Email Us</div>
          <div class="info-value">thevelorexmusic@gmail.com</div>
        </div>
        <div class="info-item">
          <div class="info-label">Call Us</div>
          <div class="info-value">+91 79060 27807</div>
        </div>
        <div class="info-item">
          <div class="info-label">Our Location</div>
          <div class="info-value">Sector - 52,<br>Gurugram, India</div>
          <div class="info-value">or</div>
          <div class="info-value">Meerut,<br>U. P., India</div>
        </div>
        <div class="info-item">
          <div class="info-label">Hours</div>
          <div class="info-value">Mon - Fri: 10AM - 6PM IST</div>
        </div>
      </div>

      <div class="glass-card">
        <div id="contact-feedback" class="contact-feedback" style="display:none; margin-bottom:1rem;"></div>
        <form id="contact-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Subject</label>
            <select name="subject" class="form-control" required>
              <option>General Inquiry</option>
              <option>Order Issue</option>
              <option>Product Stock</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="5" placeholder="How can we help you?" required></textarea>
          </div>
          <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send Message</button>
        </form>
      </div>
    </div>
  </div>
  <script src="src/js/contact.js?v=58caa3b6" defer></script>
</body>
</html>
